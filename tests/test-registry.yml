name: Test registry input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          audit_level: low
          create_issues: 'false'
          create_pr_comments: 'false'
          fail_on_vulnerabilities: 'true'
          registry: 'https://registry.npmjs.org'
          working_directory: tests/fixtures/clean-project

      - name: Assert npm_audit output is set
        env:
          AUDIT_OUTPUT: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "npm_audit output: $AUDIT_OUTPUT"
          if [ -z "$AUDIT_OUTPUT" ]; then
            echo "FAIL: expected npm_audit output to be non-empty when using registry input"
            exit 1
          fi
          echo "PASS: npm_audit output is set with registry input"
