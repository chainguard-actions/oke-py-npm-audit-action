name: Test issue options (assignees and labels)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal package.json with no vulnerabilities
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cat > "$GITHUB_WORKSPACE/test-pkg/package.json" <<'EOF'
          {
            "name": "test-package",
            "version": "1.0.0",
            "description": "Test package",
            "dependencies": {}
          }
          EOF
          cd "$GITHUB_WORKSPACE/test-pkg"
          npm install --package-lock-only 2>/dev/null || true

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: test-pkg
          audit_level: critical
          create_issues: 'false'
          create_pr_comments: 'false'
          issue_assignees: 'octocat'
          issue_labels: 'security,vulnerability'

      - name: Assert npm_audit output is present
        env:
          ACTUAL: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected npm_audit output to be non-empty"
            exit 1
          fi
          echo "PASS"
