name: Test vulnerabilities found fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/vulnerable
          create_issues: "false"
      - name: Assert action failed and still emitted output
        env:
          ACTUAL: ${{ steps.action.outputs.npm_audit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "lodash"; then
            echo "FAIL: expected lodash in audit output"
            exit 1
          fi
          echo "PASS"
