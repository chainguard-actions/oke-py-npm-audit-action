name: Test report_format markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a clean npm project with no dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cat > "$GITHUB_WORKSPACE/test-project/package.json" << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "description": "Test project with no dependencies",
            "dependencies": {}
          }
          EOF
          cd "$GITHUB_WORKSPACE/test-project"
          npm install --package-lock-only

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          audit_level: low
          create_issues: 'false'
          create_pr_comments: 'false'
          fail_on_vulnerabilities: 'true'
          report_format: markdown
          working_directory: test-project

      - name: Assert npm_audit output is set
        env:
          ACTUAL: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected npm_audit output to be non-empty"
            exit 1
          fi
          echo "PASS: npm_audit output is set with markdown report format"
