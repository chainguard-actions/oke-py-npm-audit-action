name: Test json flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/clean/
          json_flag: "true"
      - name: Assert output is JSON with zero vulnerabilities
        env:
          ACTUAL: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          TOTAL=$(printf '%s' "$ACTUAL" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              console.log(j.metadata.vulnerabilities.total);
            });
          ') || { echo "FAIL: output is not valid npm audit JSON"; exit 1; }
          echo "total: $TOTAL"
          if [ "$TOTAL" != "0" ]; then
            echo "FAIL: expected 0 total vulnerabilities"
            exit 1
          fi
          echo "PASS"
