name: Test audit_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: audit-critical
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/clean-project
          audit_level: critical
          create_issues: 'false'
          create_pr_comments: 'false'

      - name: Assert npm_audit output is set for audit_level=critical
        env:
          ACTUAL: ${{ steps.audit-critical.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected npm_audit output to be non-empty for audit_level=critical"
            exit 1
          fi
          echo "PASS: audit_level=critical works correctly"

      - id: audit-high
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/clean-project
          audit_level: high
          create_issues: 'false'
          create_pr_comments: 'false'

      - name: Assert npm_audit output is set for audit_level=high
        env:
          ACTUAL: ${{ steps.audit-high.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected npm_audit output to be non-empty for audit_level=high"
            exit 1
          fi
          echo "PASS: audit_level=high works correctly"
