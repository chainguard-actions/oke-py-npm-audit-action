name: Test invalid audit_level fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid audit_level
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/clean-project
          audit_level: invalid_level
          fail_on_vulnerabilities: 'false'
          create_issues: 'false'
          create_pr_comments: 'false'

      - name: Assert action failed with invalid audit_level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid audit_level but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid audit_level"
