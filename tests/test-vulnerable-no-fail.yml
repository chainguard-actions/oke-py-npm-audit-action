name: Test vulnerabilities found without failing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/vulnerable
          create_issues: "false"
          fail_on_vulnerabilities: "false"
      - name: Assert output reports lodash vulnerabilities
        env:
          ACTUAL: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "lodash"; then
            echo "FAIL: expected lodash in audit output"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qi "found 0 vulnerabilities"; then
            echo "FAIL: expected vulnerabilities to be reported"
            exit 1
          fi
          echo "PASS"
