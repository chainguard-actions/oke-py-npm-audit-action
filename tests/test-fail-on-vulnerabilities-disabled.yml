name: Test fail_on_vulnerabilities disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          audit_level: low
          create_issues: 'false'
          create_pr_comments: 'false'
          fail_on_vulnerabilities: 'false'
          working_directory: tests/fixtures/no-fail-project

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action completed successfully (outcome: $OUTCOME)"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed but got $OUTCOME"
            exit 1
          fi
          echo "PASS: action succeeded as expected"

      - name: Assert npm_audit output is set
        env:
          AUDIT_OUTPUT: ${{ steps.action.outputs.npm_audit }}
        run: |
          echo "npm_audit output: $AUDIT_OUTPUT"
          if [ -z "$AUDIT_OUTPUT" ]; then
            echo "FAIL: expected npm_audit output to be non-empty"
            exit 1
          fi
          echo "PASS: npm_audit output is set"
